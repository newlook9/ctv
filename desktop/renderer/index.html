<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F172A">
<title>Live TV</title>
<style>
:root{
  --bg:#0F172A; --card:#1E293B; --card2:#162033; --text:#F8FAFC; --sub:#94A3B8; --accent:#3B82F6; --line:rgba(148,163,184,.35);
}
html[data-theme="light"]{ --bg:#F1F5F9; --card:#FFFFFF; --card2:#EEF2F7; --text:#0F172A; --sub:#475569; --accent:#2563EB; --line:rgba(71,85,105,.35); }
html[data-theme="amoled"]{ --bg:#000000; --card:#161616; --card2:#0B0B0B; --text:#FFFFFF; --sub:#9CA3AF; --accent:#22D3EE; --line:rgba(156,163,175,.35); }
*{ box-sizing:border-box; }
html,body{ height:100%; margin:0; }
body{ background:linear-gradient(180deg,var(--bg),var(--card2)); color:var(--text);
  font-family: system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Nastaliq Urdu",Arial,sans-serif; overflow:hidden; }
button,input{ font:inherit; color:inherit; }
#app{ height:100dvh; display:flex; flex-direction:column; padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
#stage{ flex:none; }
#screen{ position:relative; background:#000; aspect-ratio:16/9; width:100%; overflow:hidden; }
#v{ width:100%; height:100%; background:#000; display:block; object-fit:contain; }
#v.fit1{ object-fit:fill; } #v.fit2{ object-fit:cover; }
#screen:fullscreen{ aspect-ratio:auto; width:100vw; height:100vh; }
#screen:-webkit-full-screen{ aspect-ratio:auto; width:100vw; height:100vh; }
#radioCard{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
  background:linear-gradient(180deg,#0B1B3A,#1E3A8A); color:#fff; padding:8px; text-align:center; }
#radioCard[hidden]{ display:none; }
#cardLogo{ width:64px; height:64px; border-radius:14px; object-fit:contain; background:rgba(255,255,255,.12); }
#cardName{ font-weight:700; font-size:1.05rem; max-width:90%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.eq{ display:flex; gap:4px; align-items:flex-end; height:30px; }
.eq i{ display:block; width:6px; height:100%; border-radius:3px; background:#22D3EE; transform-origin:bottom; animation:eq .9s ease-in-out infinite alternate; }
.eq i:nth-child(2){ animation-delay:-.2s; } .eq i:nth-child(3){ animation-delay:-.5s; } .eq i:nth-child(4){ animation-delay:-.1s; }
.eq i:nth-child(5){ animation-delay:-.7s; } .eq i:nth-child(6){ animation-delay:-.35s; } .eq i:nth-child(7){ animation-delay:-.6s; }
@keyframes eq{ from{ transform:scaleY(.2);} to{ transform:scaleY(1);} }
.lite .eq i{ animation:none; transform:scaleY(.5); }
@media (prefers-reduced-motion:reduce){ .eq i{ animation:none; transform:scaleY(.5);} }
#bar{ display:flex; gap:4px; padding:6px; margin:8px; border-radius:16px; background:linear-gradient(180deg,var(--card),var(--card2)); box-shadow:0 4px 14px rgba(0,0,0,.25); }
.btn{ background:transparent; border:0; border-radius:12px; padding:10px 6px; cursor:pointer; text-align:center; }
.btn:hover{ background:rgba(59,130,246,.18); }
.btn:focus-visible{ outline:3px solid var(--accent); outline-offset:1px; }
#bar .btn{ flex:1; font-size:.85rem; }
#panel{ flex:1; min-height:0; display:flex; flex-direction:column; }
#head{ display:flex; align-items:center; gap:10px; padding:8px 12px 4px; }
#head svg{ width:40px; height:40px; flex:none; }
#titles{ flex:1; min-width:0; }
#title{ font-weight:700; font-size:1.25rem; }
#status{ font-size:.78rem; color:var(--sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#scanBtn{ border:1px solid var(--accent); color:var(--accent); background:rgba(59,130,246,.14); font-size:.85rem; padding:8px 12px; }
#tabs{ display:flex; gap:4px; padding:4px 8px; }
#tabs .btn{ flex:1; font-size:.8rem; min-width:0; padding:10px 2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#tabs .btn.on{ background:var(--accent); color:#fff; }
html[data-theme="amoled"] #tabs .btn.on{ color:#000; }
#filter{ display:flex; gap:6px; padding:2px 8px 4px; align-items:center; }
#picks{ display:flex; gap:4px; flex:1.7; min-width:0; }
#picks .btn{ background:var(--card); border:1px solid var(--line); text-align:start; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding:9px 10px; font-size:.85rem; }
#itemBtn{ flex:1; min-width:0; }
#q{ flex:1; min-width:0; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:9px 10px; font-size:.85rem; }
#q::placeholder{ color:var(--sub); }
#actionBtn{ margin:2px 8px 4px; border:1px solid var(--accent); color:var(--accent); background:rgba(59,130,246,.14); }
#list{ flex:1; overflow:auto; padding:2px 8px 12px; overscroll-behavior:contain; }
.row{ display:flex; align-items:center; gap:12px; padding:8px 12px 8px 10px; margin:4px 0; border-radius:14px; background:var(--card); cursor:pointer; }
.row:hover{ outline:1px solid var(--line); }
.row:focus-visible{ outline:3px solid var(--accent); }
.row.cur .nm{ color:var(--accent); font-weight:700; }
.lg{ width:44px; height:44px; flex:none; border-radius:10px; background:rgba(148,163,184,.15); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; overflow:hidden; }
.lg img{ width:100%; height:100%; object-fit:contain; }
.nm{ flex:1; min-width:0; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; word-break:break-word; }
.hrt{ color:var(--accent); }
.num{ color:var(--sub); font-size:.8rem; min-width:2ch; }
#modal{ position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center; z-index:50; padding:12px; }
#modal[hidden]{ display:none; }
#sheet{ background:var(--bg); color:var(--text); width:min(460px,100%); max-height:86dvh; border-radius:18px; display:flex; flex-direction:column; border:1px solid var(--line); }
#sheetTitle{ font-weight:700; font-size:1.05rem; padding:14px 16px 8px; }
#sheetQ{ margin:0 12px 6px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:9px 12px; }
#sheetList{ overflow:auto; padding:2px 8px 12px; }
.opt{ display:block; width:100%; text-align:start; background:var(--card); border:0; border-radius:12px; padding:12px 14px; margin:3px 0; cursor:pointer; }
.opt:hover{ outline:1px solid var(--line); }
.opt:focus-visible{ outline:3px solid var(--accent); }
.opt.sel{ color:var(--accent); font-weight:700; }
#toast{ position:fixed; left:50%; bottom:18px; transform:translateX(-50%); background:var(--card); border:1px solid var(--line); padding:8px 14px; border-radius:12px; font-size:.85rem; z-index:60; max-width:92vw; }
#toast[hidden]{ display:none; }
#hlsNote{ font-size:.72rem; color:var(--sub); padding:0 12px 2px; }
@media (min-width:900px){
  #app{ flex-direction:row; }
  #stage{ flex:1.9; min-width:0; display:flex; flex-direction:column; justify-content:center; }
  #panel{ flex:1; max-width:520px; min-width:340px; }
}
</style>
</head>

  <section id="panel">

      <button class="btn" id="scanBtn" hidden></button>

    <div id="hlsNote" hidden></div>
    <div id="tabs"></div>
    <button class="btn" id="actionBtn" hidden></button>
    <div id="filter">
      <div id="picks"><button class="btn" id="modeBtn"></button><button class="btn" id="itemBtn"></button></div>
      <input id="q" type="search" autocomplete="off">
    </div>
    <div id="list" tabindex="-1"></div>
  </section>
</div>
<div id="modal" hidden><div id="sheet"><div id="sheetTitle"></div><input id="sheetQ" type="search" autocomplete="off" hidden><div id="sheetList"></div></div></div>
<div id="toast" hidden></div>
<input type="file" id="fileIn" accept="audio/*,video/*" multiple hidden>
<input type="file" id="restoreIn" accept="application/json,.json" hidden>

var memCache = {};

function idb() {
  if (!idbP) {
    idbP = new Promise(function (res) {
      try {
        var rq = indexedDB.open('livetv', 1);
        rq.onupgradeneeded = function () { rq.result.createObjectStore('kv'); };
        rq.onsuccess = function () { res(rq.result); };
        rq.onerror = function () { res(null); };
      } catch (e) { res(null); }
    });
  }
  return idbP;
}
function idbGet(key) {
  return idb().then(function (db) {
    if (!db) return memCache[key] || null;
    return new Promise(function (res) {
      try {
        var r = db.transaction('kv').objectStore('kv').get(key);
        r.onsuccess = function () { res(r.result || null); };
        r.onerror = function () { res(null); };
      } catch (e) { res(null); }
    });
  });
}
function idbSet(key, val) {
  memCache[key] = val;
  return idb().then(function (db) {
    if (!db) return;
    try { db.transaction('kv', 'readwrite').objectStore('kv').put(val, key); } catch (e) {}
  });
}
function idbClear() {
  memCache = {};
  return idb().then(function (db) {
    if (!db) return;
    try { db.transaction('kv', 'readwrite').objectStore('kv').clear(); } catch (e) {}
  });
}

  if (!urls.length) { renderList(true); return; }
  var batch = urls.slice(0, mode === 2 ? 8000 : 3000), total = batch.length, idx = 0;

  });
}
function showRecFor() {
  var mins = [5, 15, 30, 60, 120];
  openPicker(t('rec_for'), mins.map(function (m) { return t('minutes', m); }), -1, false, function (i) {
    if (!deskRecActive) desktopRec();
    setTimeout(function () { if (deskRecActive) window.desktop.recStop(); }, mins[i] * 60000);
  });
}
function toggleRec() {
  if (window.desktop && window.desktop.recStart) { desktopRec(); return; }
  if (recorder) { recorder.stop(); return; }
  if (!now) { toast(t('rec_play_first')); return; }
  try {
    var stream = v.captureStream ? v.captureStream() : v.mozCaptureStream();
    var mimes = ['video/mp4;codecs=avc1,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm'];
    var mt = mimes.filter(function (m) { return window.MediaRecorder && MediaRecorder.isTypeSupported(m); })[0] || '';
    var rc = new MediaRecorder(stream, mt ? { mimeType: mt } : undefined);
    recChunks = []; recStart = Date.now();
    rc.ondataavailable = function (e) { if (e.data && e.data.size) recChunks.push(e.data); };
    rc.onstop = function () {
      clearInterval(recTimer); recorder = null; applyLang();
      var type = rc.mimeType || 'video/webm', blob = new Blob(recChunks, { type: type });
      if (blob.size < 3000) { toast(t('rec_failed')); return; }
      download(blob, 'LiveTV_' + now.name.replace(/[^\w-]+/g, '_').slice(0, 30) + '_' + stamp() + (type.indexOf('mp4') >= 0 ? '.mp4' : '.webm'));
      toast(t('rec_saved'));
    };
    rc.start(1000); recorder = rc;
    recTimer = setInterval(function () { var s = Math.floor((Date.now() - recStart) / 1000); $('#bRec').textContent = '■ ' + Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2); }, 1000);
    status(t('rec_started')); applyLang();
  } catch (e) { recorder = null; toast(t('rec_failed')); }
}

// ---------- menus ----------
function onOff(b) { return t(b ? 'on' : 'off'); }
function menu(title, pairs) {
  openPicker(title, pairs.map(function (p) { return p[0]; }), -1, false, function (i) { pairs[i][1](); });
}
function showQuality() {
  var names = [t('q_auto'), '4K', '1080p', '720p', '480p', '360p', '240p'];
  openPicker(t('quality'), names, S.quality, false, function (i) { S.quality = i; saveS(); applyCap(); });
}
function showLanguage() {
  openPicker(t('set_language'), LANGS.map(function (x) { return x[0]; }), LANGS.findIndex(function (x) { return x[1] === S.lang; }), false, function (i) {
    S.lang = LANGS[i][1]; saveS(); applyLang(); renderList(true);
  });
}
function showTheme() {
  var ids = ['dark', 'light', 'amoled'];
  openPicker(t('set_theme'), ids.map(function (x) { return t('theme_' + x); }), ids.indexOf(S.theme), false, function (i) { S.theme = ids[i]; saveS(); applyTheme(); });
}
function showSleep() {
  var mins = [0, 15, 30, 45, 60, 90, 120];
  openPicker(t('set_sleep'), mins.map(function (m) { return m ? t('minutes', m) : t('sleep_off'); }), -1, false, function (i) {
    clearTimeout(sleepTimer);
    if (mins[i]) {
      sleepTimer = setTimeout(function () { v.pause(); if (recorder) recorder.stop(); if (deskRecActive && window.desktop) window.desktop.recStop(); toast(t('sleep_done')); }, mins[i] * 60000);
      toast(t('sleep_set', mins[i]));
    } else toast(t('sleep_off'));
  });
}
function chooseLocked() {
  openPicker(t('pin_cats'), CATS.map(function (c) { return (S.locked.indexOf(c.key) >= 0 ? '🔒 ' : '') + c.label; }), -1, true, function (i) {
    var k = CATS[i].key, at = S.locked.indexOf(k);
    if (at >= 0) S.locked.splice(at, 1); else S.locked.push(k);
    unlocked.clear(); saveS();
    if (!S.pin) setPin(); else chooseLocked();
  });
}
function setPin() {
  textDialog(t('pin_new'), '', true, function (p) { if (p && p.length >= 4) { S.pin = p; saveS(); } });
}
function showParental() {
  askPin(function () {
    menu(t('set_parental'), [
      [t('pin_set'), setPin],
      [t('pin_cats'), chooseLocked],
      [t('pin_remove'), function () { S.pin = ''; unlocked.clear(); saveS(); toast(t('done')); }]
    ]);
  });
}
function showSettings() {
  menu(t('settings'), [
    [t('set_language'), showLanguage],
    [t('set_theme'), showTheme],
    [t('onoff', t('set_datasaver'), onOff(S.dataSaver)), function () { S.dataSaver = !S.dataSaver; saveS(); applyCap(); toast(t('onoff', t('set_datasaver'), onOff(S.dataSaver))); }],
    [t('onoff', t('set_smooth'), onOff(S.smooth)), function () { S.smooth = !S.smooth; saveS(); applyCap(); toast(t('onoff', t('set_smooth'), onOff(S.smooth))); }],
    [t('onoff', 'Lite', onOff(S.lite)), function () { S.lite = !S.lite; saveS(); document.body.classList.toggle('lite', S.lite); renderList(true); }],
    [t('onoff', t('set_hidedead'), onOff(S.hideDead)), function () { S.hideDead = !S.hideDead; saveS(); renderList(true); }],
    [t('set_parental'), showParental],
    [t('set_backup'), function () { download(new Blob([JSON.stringify({ fav: favs, blocked: Array.from(blocked) })], { type: 'application/json' }), 'livetv-backup.json'); toast(t('done')); }],
    [t('set_restore'), function () { $('#restoreIn').click(); }],
    [t('set_unhide'), function () { blocked.clear(); LS.set('lt_blocked', []); renderList(true); toast(t('done')); }],
    [t('set_reset'), function () { stopScan(); health = {}; healthDirty = true; saveHealth(); idbClear().then(function () { currentKey = ''; setItemsForMode(); toast(t('done')); }); }],
    [t('set_updates'), function () { checkUpdate(true); }],
    [t('set_keys'), function () { window.alert(t('keys_text')); }]
  ]);
}
function showMore() {
  var fit = [t('fit_fit'), t('fit_fill'), t('fit_zoom')][S.fit];
  var sort = [t('sort_default'), t('sort_az'), t('sort_verified')][S.sort];
  var list = [
    [t('more_prev'), goPrev],
    [t('set_fit', fit), function () { S.fit = (S.fit + 1) % 3; saveS(); v.className = S.fit ? 'fit' + S.fit : ''; }],
    [t('set_sort', sort), function () { S.sort = (S.sort + 1) % 3; saveS(); renderList(); }],
    [t('onoff', t('set_verified'), onOff(S.verified)), function () { S.verified = !S.verified; saveS(); renderList(); }],
    [t('set_sleep'), showSleep],
    [t('more_info'), showInfo]
  ];
  if (window.desktop && window.desktop.recStart) {
    list.push([t('rec_for'), showRecFor]);
    list.push([t('rec_open'), function () { window.desktop.openRecordings(); }]);
  }
  list.push([t('settings'), showSettings]);
  menu(t('more'), list);
}
function newPlaylist(first) {
  textDialog(t('playlist_name'), '', false, function (n) {
    n = (n || '').trim() || t('playlist_default', playlists.length + 1);
    while (playlists.some(function (p) { return p.name === n; })) n += '_';
    playlists.push({ name: n, items: first ? [slim(first)] : [] }); savePl();
    if (first) toast(t('added_to', n));
    if (tab === 5) renderList(true);
  });
}
function addToPlaylist(c) {
  var names = playlists.map(function (p) { return p.name; }).concat([t('new_playlist')]);
  openPicker(t('choose_playlist'), names, -1, false, function (i) {
    if (i === playlists.length) { newPlaylist(c); return; }
    var p = playlists[i];
    if (!p.items.some(function (x) { return x.url === c.url; })) p.items.push(slim(c));
    savePl(); toast(t('added_to', p.name));
  });
}
function moveIn(arr, c, d) {
  var i = arr.findIndex(function (x) { return x.url === c.url; }), j = i + d;
  if (i < 0 || j < 0 || j >= arr.length) return false;
  var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp; return true;
}
function saveFiles() {
  LS.set('lt_files', localFiles.filter(function (f) { return f.path; }).map(function (f) { return { name: f.name, path: f.path, key: f.key }; }));
}
function itemMenu(c) {
  if (c.url === 'back:') return;
  if (c.url.indexOf('pl:') === 0) {
    var pl = playlists.find(function (p) { return 'pl:' + p.name === c.url; });
    if (!pl) return;
    menu(pl.name, [
      [t('m_playlist_rename'), function () {
        textDialog(t('playlist_name'), pl.name, false, function (n) {
          n = (n || '').trim();
          if (n && !playlists.some(function (p) { return p !== pl && p.name === n; })) { pl.name = n; savePl(); renderList(true); }
        });
      }],
      [t('m_playlist_delete'), function () { playlists = playlists.filter(function (p) { return p !== pl; }); savePl(); renderList(true); }]
    ]);
    return;
  }
  var had = favs.some(function (x) { return x.url === c.url; }), p = [];
  if (!c.local) p.push([t(had ? 'm_fav_remove' : 'm_fav_add'), function () { toggleFav(c); }]);
  p.push([t('m_playlist_add'), function () { addToPlaylist(c); }]);
  if (tab <= 1) p.push([t('m_hide'), function () { blocked.add(c.url); LS.set('lt_blocked', Array.from(blocked)); renderList(true); }]);
  if (tab === 2) {
    p.push([t('m_up'), function () { if (moveIn(favs, c, -1)) { LS.set('lt_fav', favs); renderList(true); } }]);
    p.push([t('m_down'), function () { if (moveIn(favs, c, 1)) { LS.set('lt_fav', favs); renderList(true); } }]);
  }
  if (tab === 3) p.push([t('m_remove'), function () { recents = recents.filter(function (x) { return x.url !== c.url; }); LS.set('lt_recent', recents); renderList(true); }]);
  if (tab === 4) p.push([t('m_remove'), function () { localFiles = localFiles.filter(function (x) { return x.url !== c.url; }); saveFiles(); renderList(true); }]);
  if (tab === 5 && openPl) {
    p.push([t('m_up'), function () { if (moveIn(openPl.items, c, -1)) { savePl(); renderList(true); } }]);
    p.push([t('m_down'), function () { if (moveIn(openPl.items, c, 1)) { savePl(); renderList(true); } }]);
    p.push([t('m_remove'), function () { openPl.items = openPl.items.filter(function (x) { return x.url !== c.url; }); savePl(); renderList(true); }]);
  }
  menu(c.name, p);
}

var DESKTOP_REPO = 'newlook9/ctv';
function checkUpdate(manual) {
  if (!(window.desktop && window.desktop.version)) return;
  window.desktop.version().then(function (ver) {
    var cur = parseInt(String(ver).split('.').pop(), 10) || 0;
    return fetchText('https://api.github.com/repos/' + DESKTOP_REPO + '/releases/latest', 15000).then(function (txt) {
      var o = null;
      try { o = txt ? JSON.parse(txt) : null; } catch (e) { o = null; }
      if (!o) { if (manual) toast(t('upd_failed')); return; }
      var n = parseInt(String(o.tag_name || '').split('-').pop(), 10) || 0;
      var asset = (o.assets || []).find(function (a) { return /\.exe$/i.test(a.name); });
      if (n > cur && asset) {
        openPicker(t('upd_title') + ': ' + t('upd_msg'), [t('upd_download'), t('upd_later')], -1, false, function (i) {
          if (i === 0) window.desktop.openExternal(asset.browser_download_url);
        });
      } else if (manual) toast(t('upd_latest'));
    });
  }).catch(function () { if (manual) toast(t('upd_failed')); });
}
function pushState() {
  if (!(window.desktop && window.desktop.setState)) return;
  window.desktop.setState({ playing: !!now && !v.paused && !v.ended, audio: !!now && (!!now.radio || v.videoWidth === 0) });
}
['playing', 'pause', 'ended', 'emptied'].forEach(function (ev) { v.addEventListener(ev, pushState); });
if (window.desktop && window.desktop.onMedia) {
  window.desktop.onMedia(function (c) {
    if (c === 'toggle') { if (v.paused) v.play().catch(function () {}); else v.pause(); }
    else if (c === 'next') step(1);
    else step(-1);
  });
}
var capTimer = null;
window.addEventListener('resize', function () { clearTimeout(capTimer); capTimer = setTimeout(applyCap, 700); });
document.addEventListener('fullscreenchange', function () { setTimeout(applyCap, 400); });
function showInfo() {
  if (!now) { window.alert(t('none')); return; }
  var lines = [now.name];
  lines.push('Video: ' + (v.videoWidth ? v.videoWidth + 'x' + v.videoHeight : '-'));
  try { var q = v.getVideoPlaybackQuality(); lines.push('Frames: ' + q.totalVideoFrames + ', dropped: ' + q.droppedVideoFrames); } catch (e) {}
  var ahead = 0;
  try { var b = v.buffered; if (b.length) ahead = b.end(b.length - 1) - v.currentTime; } catch (e) {}
  lines.push('Buffer ahead: ' + ahead.toFixed(1) + ' s');
  if (hls) {
    var lv = hls.levels && hls.levels[hls.currentLevel];
    lines.push('Quality: ' + (lv ? (lv.height || '?') + 'p, ' + Math.round((lv.bitrate || 0) / 1000) + ' kbps' : '-'));
    lines.push('Network speed: ' + Math.round((hls.bandwidthEstimate || 0) / 1000) + ' kbps');
    if (hls.latency) lines.push('Behind live: ' + hls.latency.toFixed(1) + ' s');
  } else lines.push('Engine: direct');
  lines.push('Link: ' + (queue[qi] || ''));
  window.alert(lines.join('\n'));
}
// ---------- wiring ----------
$('#bFav').onclick = function () { if (now) toggleFav(now); };
$('#bRec').onclick = toggleRec;
$('#bQ').onclick = showQuality;
$('#bFull').onclick = toggleFull;
$('#bMore').onclick = showMore;
$('#modeBtn').onclick = function () {
  openPicker(t('pick_mode'), [t('mode_country'), t('mode_category'), t('mode_world')], mode, false, applyMode);
};
$('#itemBtn').onclick = function () {
  openPicker(t(mode === 0 ? 'pick_country' : 'pick_category'), curItems.map(function (x) { return x.label; }), curIdx, true, selectItem);
};
$('#actionBtn').onclick = function () { if (tab === 5) newPlaylist(null); else $('#fileIn').click(); };
function fileUrl(p) { return encodeURI('file:///' + p.replace(/\\/g, '/')).replace(/#/g, '%23').replace(/\?/g, '%3F'); }
function addFiles(list) {
  Array.prototype.forEach.call(list, function (f) {
    var path = window.desktop && window.desktop.getPath ? window.desktop.getPath(f) : '';
    var key = f.name + ':' + f.size;
    if (localFiles.some(function (x) { return x.key === key; })) return;
    localFiles.push({ name: f.name, url: path ? fileUrl(path) : URL.createObjectURL(f), logo: '', alts: [], radio: false, local: true, key: key, path: path });
  });
  saveFiles(); if (tab === 4) renderList();
}
if (window.desktop) {
  localFiles = LS.get('lt_files', []).map(function (f) { return { name: f.name, url: fileUrl(f.path), logo: '', alts: [], radio: false, local: true, key: f.key, path: f.path }; });
}
$('#fileIn').onchange = function (e) { addFiles(e.target.files); e.target.value = ''; };
window.addEventListener('dragover', function (e) { e.preventDefault(); });
window.addEventListener('drop', function (e) {
  e.preventDefault();
  if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) { addFiles(e.dataTransfer.files); selectTab(4); }
});
$('#restoreIn').onchange = function (e) {
  var f = e.target.files[0]; if (!f) return;
  var rd = new FileReader();
  rd.onload = function () {
    try {
      var o = JSON.parse(rd.result);
      if (Array.isArray(o.fav)) { favs = o.fav; LS.set('lt_fav', favs); }
      if (Array.isArray(o.blocked)) { blocked = new Set(o.blocked); LS.set('lt_blocked', o.blocked); }
      renderList(true); applyLang(); toast(t('restore_done'));
    } catch (x) { toast(t('restore_failed')); }
  };
  rd.onerror = function () { toast(t('restore_failed')); };
  rd.readAsText(f); e.target.value = '';
};
function toggleFull() {
  var el = $('#screen');
  if (document.fullscreenElement || document.webkitFullscreenElement) {
    (document.exitFullscreen || document.webkitExitFullscreen).call(document); return;
  }
  var rq = el.requestFullscreen || el.webkitRequestFullscreen;
  if (rq) rq.call(el); else if (v.webkitEnterFullscreen) v.webkitEnterFullscreen();
}
$('#screen').addEventListener('dblclick', toggleFull);
document.addEventListener('keydown', function (e) {
  var tg = e.target && e.target.tagName;
  if (e.key === 'Escape' && !$('#modal').hidden) { closePicker(); return; }
  if (e.ctrlKey || e.altKey || e.metaKey || tg === 'INPUT' || tg === 'TEXTAREA') return;
  var k = e.key;
  if (/^[0-9]$/.test(k)) {
    numBuf = (numBuf + k).slice(-4); status(t('ch_number', parseInt(numBuf, 10)));
    clearTimeout(numTimer);
    numTimer = setTimeout(function () { var n = parseInt(numBuf, 10) || 0; numBuf = ''; var pl = playable(); if (n >= 1 && n <= pl.length) play(pl[n - 1]); }, 1500);
    return;
  }
  if (k === ' ') { e.preventDefault(); if (v.paused) v.play().catch(function () {}); else v.pause(); }
  else if (k === 'f' || k === 'F') toggleFull();
  else if (k === 'm' || k === 'M') v.muted = !v.muted;
  else if (k === 'PageUp' || k === 'n' || k === 'N') { e.preventDefault(); step(1); }
  else if (k === 'PageDown' || k === 'p' || k === 'P') { e.preventDefault(); step(-1); }
  else if (k === 'l' || k === 'L') goPrev();
  else if (k === 'r' || k === 'R') toggleRec();
  else if (k === '+' || k === '=') v.volume = Math.min(1, v.volume + 0.1);
  else if (k === '-') v.volume = Math.max(0, v.volume - 0.1);
  else if (k === '/') { e.preventDefault(); qEl.focus(); }
  else if (k === 'ArrowLeft' && now && now.local) v.currentTime = Math.max(0, v.currentTime - 10);
  else if (k === 'ArrowRight' && now && now.local) v.currentTime = v.currentTime + 10;
});

// ---------- start ----------
applyTheme();
document.body.classList.toggle('lite', !!S.lite);
if (window.desktop && Date.now() - LS.get('lt_upd', 0) > 864e5) { LS.set('lt_upd', Date.now()); setTimeout(function () { checkUpdate(false); }, 5000); }
v.className = S.fit ? 'fit' + S.fit : '';
applyLang();
loadHls();
loadCountries();
selectTab(tab);

</script>
</body>
