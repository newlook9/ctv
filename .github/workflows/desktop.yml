name: Build Desktop

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install tools
        run: npm install

      - name: Set version from the build number
        run: npm version 1.1.${{ github.run_number }} --no-git-tag-version --allow-same-version

      - name: Copy video engine
        run: node scripts/copy-hls.js

      - name: Build Windows installer
        run: npx electron-builder --win nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - uses: actions/upload-artifact@v4
        with:
          name: LiveTV-Windows-Installer
          path: desktop/dist/*.exe

      - name: Publish release for in-app update check
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-${{ github.run_number }}
          name: Live TV Desktop ${{ github.run_number }}
          files: desktop/dist/*.exe
